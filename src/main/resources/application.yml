spring:
  application:
    name: travel-planner
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/travel_planner}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maxLifetime: 1800000
      validationTimeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history
    connectRetries: 10
    connectRetryInterval: 5s
  sql:
    init:
      mode: never
      encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

ors:
  api:
    url: "https://api.openrouteservice.org"
    key: ${ORS_API_KEY:}

openweathermap:
  api:
    url: "https://api.openweathermap.org/data/2.5/forecast"
    key: ${OPENWEATHERMAP_API_KEY:}

nominatim:
  api:
    url: ${NOMINATIM_API_URL:https://nominatim.openstreetmap.org/search}

osrm:
  api:
    url: ${OSRM_API_URL:https://router.project-osrm.org}

gemini:
  api:
    url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent"
    key: ${GEMINI_API_KEY:}

rate-limit:
  requests-per-minute: 5

app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@localhost}
    password: ${APP_ADMIN_PASSWORD:admin}

overpass:
  api:
    url: ${OVERPASS_API_URL:https://overpass-api.de/api/interpreter}

destination:
  dynamic-search:
    enabled: true
    min-candidates-threshold: 5
    search-radius-km: 5.0
    max-results: 30
